name: ControlHacker
main: com.controlhacker.bukkit.ControlHackerPlugin
version: 2.0.0
api-version: 1.20
commands:
  control:
    description: Gestione controlli
    usage: /control
permissions:
  controlhacker.control:
    default: op
  controlhacker.finish:
    default: op
  controlhacker.stats:
    default: op
  controlhacker.top:
    default: op
  controlhacker.reload:
    default: op
